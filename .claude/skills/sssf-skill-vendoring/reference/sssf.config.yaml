# sssf.config.yaml — the factory's agent roster. One agent, one prompt, one purpose.
# Two coding agents are available. `claude_code` is the default because it runs
# on the engineer's logged-in Claude Code session — headless `claude -p`, no API
# key, nothing to configure beyond being logged in. `pi` runs the Pi harness and
# needs a provider key per model; see env.sample.
#
# Whichever you pick, every `model:` must resolve. For claude_code that means
# anthropic/<model-id>; for pi, anything `pi --list-models` lists.
#
# This roster's skill_engineering lists and the planner/builder/reviewer
# system.md amendments came from the Pocock + Trail of Bits cross-ecosystem
# research pass, validated in a real run (adw_id a1fba942) before being
# promoted here from sssf.config.experiment-pocock-tob.yaml (now retired).
# See docs/agents/skill-engineering-experiment.md for the full research,
# the per-role ranked rationale, and that run's results.
defaults:
  coding_agent: claude_code
  model: anthropic/claude-sonnet-4-6   # provider/id — a bare pattern is ambiguous across providers
  thinking: medium                 # off | minimal | low | medium | high | xhigh | max
  harness_engineering: []          # pi extensions loaded into the harness (-e).
                                   # IGNORED under coding_agent: claude_code —
                                   # see references/config.md.
  # Roster-wide allowlist; any agent may override with its own list.
  # NOTE: --tools filters extension and custom tools too, not just builtins. An agent
  # whose harness_engineering extension registers a tool MUST name that tool in its own
  # tools list — otherwise the extension loads and its tool is silently filtered out.
  tools:
    - read                         # read file contents
    - bash                         # execute bash commands
    - edit                         # find/replace edits
    - write                        # create/overwrite files
    - grep                         # search file contents  (pi default: OFF)
    - find                         # find files by glob     (pi default: OFF)
    - ls                           # list directories       (pi default: OFF)
  # Off-limits to every agent that does not name them in its own `writes`.
  # `tools` alone cannot protect these: bash runs `git checkout`, and write
  # reaches any path. An agent must not be able to edit the machinery that
  # decides whether its own work passed. Enforced in adw_modules/permissions.py.
  #
  # `writes:` per agent says what it may change IN THE REPO. It never restricts
  # the session runtime under data_dir — context_handoff/, envelopes, prompts,
  # raw output. Every agent can always write its own report; `writes: []` means
  # read-only with respect to the repo, not mute.
  protected_files:
    - adws/adw_modules/
    - adws/adw_sssf_config/
    - adws/adw_*.py
  data_dir: adws/adw_data          # runtime home: {data_dir}/sessions/{adw_id}/{agent_name}/

observability:
  db: adws/adw_data/sssf.db        # tracer writes here directly; the UI polls it
  poll_ms: 500                     # visualizer live-poll cadence

agents:
  - name: planner
    coding_agent: opencode
    model: opencode/opencode/muse-spark-1.3-contributor-free # anthropic/claude-opus-4-6
    thinking: high
    color: "#a78bfa"                 # optional hex — the agent's lane color in the visualizer
    purpose: Turn a request into a plan the builder can implement without asking questions.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/planner/system.md
      user: adws/adw_data/prompt_engineering/planner/user.md
    skill_engineering:              # composed onto the system prompt, in this order,
                                     # after the planner's own system.md. Re-armed
                                     # 2026-10-07 by a 3-round opus-vs-fable debate
                                     # (docs/agents/planner-roster-debate.md) after
                                     # wayfinder/to-spec/to-tickets were found to be
                                     # dead text on every queued ticket — the human
                                     # bootstrap chain (grill-with-docs/wayfinder →
                                     # to-spec → to-tickets → /triage) already does
                                     # everything those three skills' text describes,
                                     # before a ticket ever reaches ready-for-agent.
                                     # codebase-design and tdd are the shared flattened
                                     # composites the builder (and scout) load too
                                     # (2026-10-09, sssf-skill-vendoring); sharp-edges
                                     # is a planner-specific trim.
      - adws/adw_data/skill_engineering/codebase-design.md
      - adws/adw_data/skill_engineering/tdd.md
      - adws/adw_data/skill_engineering/sharp-edges-planner.md
    # harness_engineering intentionally unset: this agent is coding_agent: opencode,
    # which maps subagent_* onto its own built-in `task` tool. (Corrected 2026-10-07 —
    # this comment previously said claude_code/Task, stale since the opencode switch;
    # see planner-roster-debate.md fact G1. Note G2/G3: under opencode, `tools:` below
    # is decorative — there's no --tools allowlist — and 39 real planner traces show
    # zero observed task/skill calls despite subagent_* being nominally reachable.)
    writes:                        # the plan is the only thing it may leave in the repo
      - specs/
    tools:                         # full recon + write for plan.md; no edit — the planner never touches repo files
      - read
      - grep
      - find
      - ls
      - bash
      - write
      - subagent_create            # extension tools MUST be named here or they are filtered out
      - subagent_continue
      - subagent_list
      - subagent_remove

  - name: builder
    coding_agent: opencode               # was claude_code/claude-sonnet-4-6 — trying muse-spark here
    model: opencode/opencode/muse-spark-1.3-contributor-free  # anthropic/claude-sonnet-4-6
    thinking: high
    color: "#22d3ee"
    purpose: Implement the plan exactly; report every changed file in the envelope.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/builder/system.md
      user: adws/adw_data/prompt_engineering/builder/user.md
    skill_engineering:
      - adws/adw_data/skill_engineering/codebase-design.md
      - adws/adw_data/skill_engineering/tdd.md
      - adws/adw_data/skill_engineering/property-based-testing.md
    # No `writes` key: unrestricted, and the only agent that is. It still cannot
    # touch defaults.protected_files — the builder does not get to edit its own grader.
    tools:                         # the only agent that mutates the repo — everything on
      - read
      - grep
      - find
      - ls
      - bash
      - edit
      - write

  - name: scout
    model: anthropic/claude-haiku-4-5
    color: "#fbbf24"
    purpose: Find and report where things live; change nothing.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/scout/system.md
      user: adws/adw_data/prompt_engineering/scout/user.md
    skill_engineering:
      - adws/adw_data/skill_engineering/codebase-design.md
    # harness_engineering intentionally unset — same reasoning as planner above:
    # this agent is coding_agent: claude_code, which ignores the field.
    writes: []                     # read-only, and now actually read-only: its findings
                                   # go to context_handoff/, which is runtime, not the repo
    tools:                         # search-heavy recon; write only so scout_findings.md lands without a bash heredoc
      - read
      - grep
      - find
      - ls
      - bash
      - write
      - subagent_create            # extension tools MUST be named here or they are filtered out
      - subagent_continue
      - subagent_list
      - subagent_remove

  # No tester agent: running the suite is a known command, so it is a kind="code"
  # phase over adw_modules/quality.py. See SKILL.md hard rule 8.

  - name: reviewer
    model: anthropic/claude-opus-4-6
    thinking: high
    color: "#fb7185"
    purpose: Confirm that what was built is what was asked for; change nothing.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/reviewer/system.md
      user: adws/adw_data/prompt_engineering/reviewer/user.md
    skill_engineering:
      - adws/adw_data/skill_engineering/sharp-edges.md         # design-level footguns first
      - adws/adw_data/skill_engineering/differential-review.md # delta-level risk second
      - adws/adw_data/skill_engineering/code-review.md         # generic spec-conformance pass last
    writes: []                     # a reviewer that cannot fix cannot quietly fix — the
                                   # claim the tool list only implied, now enforced
    tools:                         # full read surface; write only for review.md, no edit
      - read
      - grep
      - find
      - ls
      - bash
      - write

  - name: documenter
    model: anthropic/claude-haiku-4-5
    color: "#e879f9"
    purpose: Write up the change that was just made, from the diff; document only.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/documenter/system.md
      user: adws/adw_data/prompt_engineering/documenter/user.md
    skill_engineering:
      - adws/adw_data/skill_engineering/writing-for-agents.md  # how agent-read docs (the OKF bundle) are written
      - adws/adw_data/skill_engineering/okf.md                 # maintain .okf/ + roadmap for the next agents
      - adws/adw_data/skill_engineering/pr.md                  # write-up template
    writes:                        # documentation only — "document only" is a rule now,
      - app_docs/                  # not a line in a prompt the model may drift from.
      - docs/                      # Markdown anywhere, because docs live next to the
      - "**/*.md"                  # code they describe as often as in a docs folder.
      - "*.md"
    tools:                         # reads the diff and the code; writes/edits documentation only
      - read
      - grep
      - find
      - ls
      - bash
      - write
      - edit
